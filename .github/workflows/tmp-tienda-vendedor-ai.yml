name: tmp-tienda-vendedor-ai

on:
  push:
    branches:
      - feat/tienda-vendedor-ai
    paths:
      - .github/workflows/tmp-tienda-vendedor-ai.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tienda-vendedor-ai
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ajustes de compatibilidad Edge
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('supabase/functions/tienda-asistente-pedido/index.ts')
          s = p.read_text()
          old = '  const saleDate = new Map((sales ?? []).map((v: any) => [v.id, v.fecha]));'
          new = '  const saleDate = new Map<string, string>((sales ?? []).map((v: any) => [String(v.id), String(v.fecha)] as [string, string]));'
          assert old in s
          s = s.replace(old, new, 1)
          old = '    const date = saleDate.get(l.venta_id); if (!date) continue;'
          new = '    const date = saleDate.get(String(l.venta_id)); if (!date) continue;'
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('supabase/functions/_shared/tiendaAuth.ts')
          s = p.read_text()
          old = '{ name: "PBKDF2", salt, iterations, hash: "SHA-256" },'
          new = '{ name: "PBKDF2", salt: new Uint8Array(salt).buffer, iterations, hash: "SHA-256" },'
          assert old in s
          s = s.replace(old, new, 1)
          old = 'const ok = await crypto.subtle.verify("HMAC", key, b64urlDecode(s), enc.encode(`${h}.${p}`));'
          new = 'const ok = await crypto.subtle.verify("HMAC", key, new Uint8Array(b64urlDecode(s)).buffer, enc.encode(`${h}.${p}`));'
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Typecheck app
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Build app
        run: npm run build
      - name: Install Deno
        run: curl -fsSL https://deno.land/install.sh | sh
      - name: Check Edge Function
        run: ~/.deno/bin/deno check supabase/functions/tienda-asistente-pedido/index.ts
      - name: Commit compatibility fixes
        shell: bash
        run: |
          git config user.name "DiegoUniline"
          git config user.email "diego.leon@uniline.mx"
          git add supabase/functions/tienda-asistente-pedido/index.ts supabase/functions/_shared/tiendaAuth.ts
          git diff --cached --quiet || git commit -m "fix: valida vendedor AI en Edge Runtime"
          git push origin HEAD:feat/tienda-vendedor-ai
