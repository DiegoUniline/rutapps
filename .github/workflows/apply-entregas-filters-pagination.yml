name: Apply Entregas Filters Pagination

on:
  push:
    branches:
      - feat/logistica-entregas-filtros-paginacion-20260910

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/logistica-entregas-filtros-paginacion-20260910
          fetch-depth: 0

      - name: Apply targeted patch
        run: python scripts/apply_entregas_filters_pagination.py

      - name: Verify intended diff
        run: git diff --check

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/shared/DateRangePicker.tsx src/hooks/useEntregasWorkspace.ts src/pages/EntregaListPage.tsx src/pages/DemandaPage.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: coordinate Entregas date filters and top pagination"
          git push origin HEAD:feat/logistica-entregas-filtros-paginacion-20260910
