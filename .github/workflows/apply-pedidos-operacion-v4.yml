name: Apply Pedidos Operacion V4

on:
  push:
    branches:
      - perf/pedidos-operacion-v4-20260910

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: perf/pedidos-operacion-v4-20260910
          fetch-depth: 0

      - name: Apply targeted patch
        run: python3 scripts/apply_pedidos_operacion_v4.py

      - name: Verify diff
        run: git diff --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/DemandaPage.tsx
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
          else
            git commit -m "perf: split pedidos operation summary and lazy detail loading"
            git push origin HEAD:perf/pedidos-operacion-v4-20260910
          fi
