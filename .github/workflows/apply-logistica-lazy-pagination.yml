name: Apply Logistica Lazy Pagination

on:
  push:
    branches:
      - perf/logistica-lazy-pagination-20260910

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: perf/logistica-lazy-pagination-20260910
          fetch-depth: 0

      - name: Apply targeted patch
        run: python3 scripts/apply_logistica_lazy_pagination.py

      - name: Verify diff
        run: git diff --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/DemandaPage.tsx src/pages/EntregaListPage.tsx src/pages/logistica/ConcentradoSurtidoPage.tsx supabase/migrations/20260910103500_logistica_lazy_pagination_v3.sql
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
          else
            git commit -m "perf: lazy-load concentrado products and flexible logistics paging"
            git push origin HEAD:perf/logistica-lazy-pagination-20260910
          fi
