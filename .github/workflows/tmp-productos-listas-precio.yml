name: tmp-productos-listas-precio

on:
  push:
    branches:
      - feat/productos-listas-precio-masivo
    paths:
      - .github/workflows/tmp-productos-listas-precio.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/productos-listas-precio-masivo
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Aplicar cambios
        run: python3 scripts/tmp_patch_productos_listas.py

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Commit functional changes
        shell: bash
        run: |
          git config user.name "DiegoUniline"
          git config user.email "diego.leon@uniline.mx"
          git add src/pages/ProductosListPage.tsx src/lib/importUtils.ts src/components/ImportDialog.tsx
          git commit -m "feat: modo masivo de listas de precio en productos"
          git push origin HEAD:feat/productos-listas-precio-masivo
