name: Apply Inline Pago Saldos Cliente

on:
  push:
    branches:
      - feat/saldos-cliente-aplicar-pago-inline

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/saldos-cliente-aplicar-pago-inline
          fetch-depth: 0
      - name: Apply integration patch
        run: python scripts/apply_inline_pago_saldos_cliente.py
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build application
        run: bun run build
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/EstadoCuentaClientePage.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: apply client payments inline from account balance"
            git push origin HEAD:feat/saldos-cliente-aplicar-pago-inline
          fi
