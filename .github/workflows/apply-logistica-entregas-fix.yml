name: Apply logistics entregas patch

on:
  push:
    branches:
      - fix/logistica-pedidos-entregas-performance-20260909
    paths:
      - scripts/apply_logistica_entregas_patch.py

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/logistica-pedidos-entregas-performance-20260909
          fetch-depth: 0

      - name: Apply targeted patch
        run: python scripts/apply_logistica_entregas_patch.py

      - name: Verify diff
        run: git diff --check

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/EntregaListPage.tsx
          git commit -m "feat: add date basis filter to logistics entregas"
          git push origin HEAD:fix/logistica-pedidos-entregas-performance-20260909
