name: Apply logistics pedidos patch

on:
  push:
    branches:
      - fix/logistica-pedidos-entregas-performance-20260909
    paths:
      - scripts/apply_logistica_pedidos_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/logistica-pedidos-entregas-performance-20260909
          fetch-depth: 0

      - name: Apply targeted patch
        run: python scripts/apply_logistica_pedidos_patch.py

      - name: Verify diff
        run: git diff --check

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/DemandaPage.tsx
          git commit -m "perf: optimize pedidos historical loading and date filters"
          git push origin HEAD:fix/logistica-pedidos-entregas-performance-20260909
