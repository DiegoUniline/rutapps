name: tmp-juan-lopez-intro

on:
  push:
    branches:
      - feat/juan-lopez-tienda-intro
    paths:
      - .github/workflows/tmp-juan-lopez-intro.yml

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/juan-lopez-tienda-intro
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply patch
        run: python3 scripts/tmp_juan_lopez_intro.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Typecheck app
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build app
        run: npm run build

      - name: Install Deno
        run: curl -fsSL https://deno.land/install.sh | sh

      - name: Check seller Edge Function
        run: ~/.deno/bin/deno check supabase/functions/tienda-asistente-pedido/index.ts

      - name: Commit changes
        run: |
          git config user.name "DiegoUniline"
          git config user.email "diego.leon@uniline.mx"
          git add src/components/tienda/PedidoAsistente.tsx supabase/functions/tienda-asistente-pedido/seller.ts
          git diff --cached --quiet || git commit -m "feat: presenta a Juan Lopez como asesor AI de tienda"
          git push origin HEAD:feat/juan-lopez-tienda-intro
