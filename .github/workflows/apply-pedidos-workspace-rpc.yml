name: Apply pedidos workspace RPC patch

on:
  push:
    branches:
      - fix/logistica-pedidos-workspace-rpc-20260909
    paths:
      - scripts/apply_pedidos_workspace_rpc_patch.py
      - .github/workflows/apply-pedidos-workspace-rpc.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/logistica-pedidos-workspace-rpc-20260909
          fetch-depth: 0

      - name: Apply targeted patch
        run: python3 scripts/apply_pedidos_workspace_rpc_patch.py

      - name: Verify diff
        run: git diff --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/DemandaPage.tsx
          git commit -m "perf: load logistics pedidos from summary RPC"
          git push origin HEAD:fix/logistica-pedidos-workspace-rpc-20260909
