name: Fix Pedidos TDZ

on:
  push:
    branches:
      - fix/pedidos-tdz-20260910

permissions:
  contents: write

jobs:
  fix-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pedidos-tdz-20260910
          fetch-depth: 0
      - name: Apply targeted fix
        run: python scripts/fix_pedidos_tdz.py
      - name: Verify TDZ order
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/pages/DemandaPage.tsx').read_text()
          d=s.index("const [showAsignarDialog, setShowAsignarDialog] = useState(false);")
          u=s.index("enabled: !!empresa?.id && (vendedoresOpen || showCrearDialog || showSurtirDialog || showAsignarDialog)")
          assert d < u, (d,u)
          print('Declaration precedes use:', d, u)
          PY
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build application
        run: bun run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/DemandaPage.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: declare pedidos assignment state before use"
            git push origin HEAD:fix/pedidos-tdz-20260910
          fi
