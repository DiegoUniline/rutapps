name: Apply Logistica Pedidos V2

on:
  push:
    branches:
      - fix/logistica-pedidos-v2-paginacion-rls-20260909

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/logistica-pedidos-v2-paginacion-rls-20260909
          fetch-depth: 0

      - name: Apply targeted patch
        run: python scripts/apply_logistica_pedidos_v2_patch.py

      - name: Verify diff
        run: git diff --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/DemandaPage.tsx
          if git diff --cached --quiet; then
            echo "No frontend changes to commit"
            exit 0
          fi
          git commit -m "perf: paginate logistics pedidos workspace v2"
          git push origin HEAD:fix/logistica-pedidos-v2-paginacion-rls-20260909
