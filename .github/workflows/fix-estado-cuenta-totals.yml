name: Fix Estado Cuenta Totals

on:
  push:
    branches:
      - fix/estado-cuenta-totals-20260910

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/estado-cuenta-totals-20260910
          fetch-depth: 0
      - name: Apply totals reconciliation
        run: python scripts/fix_estado_cuenta_totals.py
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build application
        run: bun run build
      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/EstadoCuentaClientePage.tsx src/lib/estadoCuentaPdf.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: reconcile estado de cuenta totals"
            git push origin HEAD:fix/estado-cuenta-totals-20260910
          fi
